<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{with .Title}}{{.}} · {{end}}lurker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">lurker</a>
    {{if .User}}
    <nav>
      <a href="/subs">subs</a>
      <a href="/search">search</a>
      {{if not .User.Local}}<a href="/logout" title="signed in as {{.User.Name}}">logout</a>{{end}}
    </nav>
    {{end}}
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
